[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "finsight"
version = "0.1.0"
description = "A data-engineering project and a machine learning dashboard to analyize the financial transactions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    #Data processing
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",

    #Database connectivity
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",

    #Configuration
    "python-dotenv>=1.0,<2.0",

    #Machine Learning
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",

    #API development
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    #Testing
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",

    #Code Quality
    "ruff>=0.9,<1.0",
    "mypy>=1.10,<2.0",
]
analytics = [
    # SQL transformation and analytics
    "dbt-core>=1.9,<2.0",
    "dbt-postgres>=1.9,<2.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/finsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
